appId: dev.latis.app
productName: Latis
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  # Latis drives the user's installed `claude`; the SDK's bundled CLI binaries (~260 MB each) don't ship.
  - "!**/node_modules/@anthropic-ai/claude-agent-sdk-*/**"
asarUnpack:
  - "**/*.node"
  # node-pty execs its spawn-helper binary, which can't run from inside the asar.
  - "**/node_modules/node-pty/**"
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  # Signing + notarization land in M7.
  identity: null
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
