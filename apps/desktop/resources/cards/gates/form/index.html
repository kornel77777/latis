<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Form</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="gate.css" />
    <style>
      label {
        display: block;
        margin-bottom: 8px;
      }
      label input {
        width: 100%;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <h1>Form</h1>
    <div id="context" class="text muted" style="margin-bottom: 8px"></div>
    <form id="f"></form>
    <script>
      async function show() {
        const fields = (await latis.data.get("fields")) ?? ["Answer"];
        const inbox = (await latis.data.get("inbox")) ?? [];
        document.getElementById("context").textContent = inbox[0] ? `${inbox[0].label}: ${inbox[0].text}` : "";
        const f = document.getElementById("f");
        f.innerHTML = "";
        for (const name of fields) {
          const l = document.createElement("label");
          l.innerHTML = "<span></span><input>";
          l.firstChild.textContent = name;
          l.lastChild.name = name;
          f.appendChild(l);
        }
        const b = document.createElement("button");
        b.className = "primary";
        b.textContent = "Send on";
        f.appendChild(b);
      }
      document.getElementById("f").onsubmit = async (e) => {
        e.preventDefault();
        const lines = [...e.target.querySelectorAll("input")].map((i) => `${i.name}: ${i.value}`);
        await latis.sendToFlow({ text: lines.join("\n") });
        await latis.data.set("inbox", []);
        show();
      };
      latis.data.onChange(show);
      show();
    </script>
  </body>
</html>
