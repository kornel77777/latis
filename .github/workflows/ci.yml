name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Run workflow (Actions tab) also uploads the packaged apps.
  workflow_dispatch:

# A newer push supersedes older runs on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.34.7 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: e2e (replays + demo agent)
        run: |
          # Only what Electron needs; `playwright install-deps` pulls every browser's codecs and can take an hour.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libnss3 libgbm1 libasound2t64 libgtk-3-0 libxss1
          xvfb-run -a pnpm e2e
      - name: e2e traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: apps/desktop/test-results/
          retention-days: 3

  build:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: node-gyp 11 (better-sqlite3 builds from source) fails to find Visual Studio on newer images.
        os: [macos-latest, windows-2022, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable && corepack prepare pnpm@10.34.7 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lattiz/desktop package
      # ~700 MB per run across the three OSes: every push checks that packaging works, but only a manual run keeps
      # the result, so the storage quota stays free for e2e traces.
      - if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: lattiz-${{ matrix.os }}
          path: apps/desktop/release/
          retention-days: 2
